<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rustx86 — ブラウザで動く16bit UNIX (ELKS)</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    max-width: 62rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; line-height: 1.7;
  }
  h1 { font-size: 1.35rem; margin-bottom: .25rem; }
  .sub { opacity: .7; font-size: .9rem; margin-top: 0; }
  #screen {
    display: block; width: 100%; max-width: 720px; margin: 1rem 0;
    background: #000; border-radius: .3rem;
    image-rendering: pixelated;
  }
  #screen:focus { outline: 2px solid #2563eb; outline-offset: 2px; }
  .bar { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin: 1rem 0 0; }
  button {
    font: inherit; padding: .45rem 1.1rem; border-radius: .4rem;
    border: 1px solid currentColor; background: transparent; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  input[type=file] { font-size: .85rem; }
  #status { font-size: .9rem; opacity: .8; min-height: 1.6em; margin: .6rem 0 0; }
  .note { font-size: .875rem; opacity: .75; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: .9em; }
  .warn { color: #b45309; }
  @media (prefers-color-scheme: dark) { .warn { color: #fbbf24; } }
</style>
</head>
<body>
  <h1>rustx86 — ブラウザで動く16bit UNIX</h1>
  <p class="sub">Rustで書いた8086エミュレータの上で <a href="https://github.com/ghaerr/elks">ELKS</a> を起動する。画面はテキストVRAM (0xB8000) を直接描いている。</p>

  <canvas id="screen" width="720" height="400" tabindex="0"></canvas>

  <div class="bar">
    <button id="boot" disabled>起動</button>
    <label>ディスクイメージ <input type="file" id="file" accept=".img"></label>
    <button id="login" disabled>root でログイン</button>
    <button id="ls" disabled>ls を打つ</button>
  </div>
  <p id="status">読み込み中…</p>

  <p class="note">
    <strong>画面をクリックしてからキーを打つ。</strong>入力は8042キーボードコントローラへ
    スキャンコードとして流れ、IRQ1でカーネルに届く。文字コードを直接渡してはいない。
  </p>
  <p class="note">
    ディスクイメージはリポジトリに含めていない (配布物のため)。
    <code>fd1440.img</code> を <a href="https://github.com/ghaerr/elks/releases">ELKSのリリース</a>
    から取得して選ぶか、このページと同じ場所に置くと自動で読み込む。
  </p>

  <script type="module" src="./elks.js"></script>
</body>
</html>
