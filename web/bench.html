<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rustx86 — 実行速度ベンチ (WASM)</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    max-width: 48rem; margin: 0 auto; padding: 2rem 1.25rem; line-height: 1.7;
  }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  .sub { opacity: .7; font-size: .9rem; margin-top: 0; }
  fieldset {
    border: 1px solid rgba(128,128,128,.4); border-radius: .5rem;
    padding: .75rem 1rem 1rem; margin: 1.5rem 0 1rem;
  }
  legend { padding: 0 .4rem; font-size: .875rem; opacity: .8; }
  .row { display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: center; }
  label { font-size: .9rem; }
  input[type=number] { width: 5.5rem; font: inherit; padding: .2rem .4rem; }
  select { font: inherit; padding: .2rem .3rem; }
  input[type=file] { font-size: .85rem; max-width: 100%; }
  button {
    font: inherit; padding: .6rem 1.4rem; border-radius: .4rem;
    border: 1px solid currentColor; background: transparent; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin: 1rem 0 0; min-height: 1.7em; font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid rgba(128,128,128,.3); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.warmup td { opacity: .6; }
  .note { font-size: .875rem; opacity: .75; }
  .warn { color: #b45309; }
  @media (prefers-color-scheme: dark) { .warn { color: #fbbf24; } }
  code { font-family: ui-monospace, Menlo, monospace; font-size: .9em; }
</style>
</head>
<body>
  <h1>rustx86 — 実行速度ベンチ (WASM)</h1>
  <p class="sub">任意のブートセクタを流して命令毎秒を測る。ネイティブ側の基準線は README を参照。</p>
  <p class="note">
    <strong>これは計測だけの静かな部屋である。</strong> 同じベンチは
    <a href="./index.html">本体ページ</a>の左メニューからも選べて、そちらは
    OSと同じ扱いで右のペインに出る。中身は同じ部品 (<code>bench.js</code>) で、
    ここには端末もエミュレータも載っていない — <strong>ページの他の部分が
    CPUを取り合わない</strong>ことだけが違う。
  </p>

  <main id="bench"></main>

  <script type="module">
    import init from './pkg/rustx86_wasm.js?v=10';
    import { mountBench } from './bench.js?v=5';
    import { Debugger } from './debugger.js?v=15';

    await init();
    // 単独ページでもデバッガは使える。載せ方が違うだけで中身は同じ
    let bench = null;
    const dbg = new Debugger({
      emu: () => bench?.emu ?? null,
      isPaused: () => bench?.paused ?? true,
      setPaused: v => bench?.setPaused(v),
    });
    bench = mountBench(document.getElementById('bench'), {
      onStop: why => dbg.onStop(why),
      onDebug: async () => {
        await bench.ensureDebugMachine();
        dbg.show();
      },
    });
  </script>
</body>
</html>
