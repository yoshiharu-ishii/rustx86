[package]
name = "rustx86-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
rustx86-core = { path = "../core" }
rustx86-disasm = { path = "../disasm" }
js-sys = "0.3.104"

[dev-dependencies]
wasmparser = "0.256.0"

# wasm-packのreleaseは既定でwasm-opt -O (=O2相当) を通す。-O3へ引き上げ
# (S1即日枠、A/Bで裁く。-O4はIR flattenで巨大関数が爆発し得るため見送り)
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
