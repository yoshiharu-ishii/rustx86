# OS起動回帰 — ELKS / FreeDOS / Linux をプロンプトまで起動し、画面を残す。
#
# **mainへのマージ時だけ回す。** PRごとの回帰はやらない — イメージ取得と
# リリースビルドで数分かかり、PRの回転を鈍らせる。マージ後に赤くなったら
# そのコミットが犯人、という切り分けで十分回る (手動実行の口も残す)。
#
# イメージ (GPL配布物) は**リポジトリに置かず、毎回スクリプトで取得する**。
# 入手経路は tools/fetch-images.sh ただ一つ — CIだけの取り方を作ると
# 手元と食い違う。Actionsのキャッシュには乗せるが、これは配布ではなく
# CI内部の控えである。
#
# 中身は cargo run --example regress (docs/ci.md)。プロンプトが出た画面の
# 「スクショ」(テキストダンプ) をレポートに貼るのが眼目 — 到達の真偽だけでなく、
# **何が映っていたか**が残る。
name: OS起動回帰

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: never

jobs:
  regress:
    name: OS起動回帰
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: イメージのキャッシュ
        id: img-cache
        uses: actions/cache@v4
        with:
          path: images
          key: os-images-v1-${{ hashFiles('tools/fetch-images.sh', 'tools/extract-vmlinux.sh', 'tools/make-mini-initramfs.sh', 'tools/mkcpio.py') }}

      - name: イメージの取得と組み立て
        if: steps.img-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpio unzip
          tools/fetch-images.sh elks
          tools/fetch-images.sh freedos-boot
          tools/fetch-images.sh linux
          tools/extract-vmlinux.sh
          tools/make-mini-initramfs.sh

      - name: 起動回帰 (プロンプト到達 + 画面のスクショ)
        id: regress
        continue-on-error: true
        run: cargo run --release --example regress | tee regress.md

      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: OS起動回帰 結果
          title: ${{ steps.regress.outcome == 'success' && 'ELKS / FreeDOS / Linux 合格' || '失敗あり' }}
          outcome: ${{ steps.regress.outcome }}
          report-file: regress.md

      - name: 合否判定
        run: test "${{ steps.regress.outcome }}" = "success"
