<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rustx86 — ブラウザで動くx86エミュレータ</title>
<style>
  :root {
    color-scheme: light dark;
    --line: rgba(128,128,128,.35);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    max-width: 60rem; margin: 0 auto; padding: 1rem 1.25rem 3rem; line-height: 1.6;
  }
  h1 { font-size: 1.2rem; margin: 0 0 .15rem; }
  .sub { opacity: .7; font-size: .85rem; margin: 0 0 .8rem; }

  /* 端末を主役にする */
  /* 枠の中は黒地なので、**文字色をページから継承させない**。
     ライトテーマだと黒地に黒文字になって何も見えなくなる (実際にそうなった)。 */
  .console {
    border: 1px solid #2a2a2a; border-radius: .5rem; overflow: hidden;
    background: #000; color: #d8d8d8;
  }
  .console.drop { outline: 2px dashed #00aa00; outline-offset: -6px; }
  /* オープニング。マシンを選ぶまで端末の代わりにここが出る。
     端末の緑に寄せた「それっぽい」文体はやめて、普通の紹介ページとして書く */
  #welcomePane { padding: 2.4rem 2.2rem 2rem; color: #c9cdd1; }
  #welcomePane h2 { margin: 0 0 .5rem; font-size: 1.35rem; font-weight: 650;
                    color: #f0f2f4; letter-spacing: .01em; }
  #welcomePane .lead { margin: 0 0 1.6rem; font-size: .95rem; color: #9aa1a8;
                       max-width: 34rem; }
  #welcomePane .oscards { display: grid; gap: .7rem;
                          grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
                          max-width: 40rem; }
  #welcomePane .oscards button {
    font: inherit; text-align: left; cursor: pointer;
    background: #141719; color: inherit;
    border: 1px solid #2b3036; border-radius: .6rem;
    padding: .85rem .95rem; display: flex; flex-direction: column; gap: .3rem;
    transition: border-color .12s, background .12s;
  }
  #welcomePane .oscards button:hover { border-color: #3b82f6; background: #171c22; }
  #welcomePane .oscards .os { font-weight: 600; font-size: .95rem; color: #e8eaec; }
  #welcomePane .oscards .d { font-size: .8rem; color: #9aa1a8; line-height: 1.55; }
  #welcomePane .fine { margin: 1.6rem 0 0; font-size: .8rem; color: #757c83; }
  #welcomePane .oscards button.mediaslot {
    border-style: dashed; background: transparent;
  }
  #welcomePane .oscards button.mediaslot:hover { background: #14181c; }

  /* 端末は**常に画面に収まる**ようにする。
     幅いっぱいに広げるが、縦がはみ出すなら幅の方を諦める。
     アスペクト比を固定してあるので、縮んでも文字が潰れない。
     (80桁 x 9px + スクロールバー10px) : (25行 x 16px) = 730 : 400 */
  #screen {
    display: block; cursor: text; margin: 0 auto;
    width: 100%; height: auto;
    aspect-ratio: 730 / 400;
    max-width: calc((100vh - 15rem) * 730 / 400);
  }
  #screen:focus { outline: none; }
  /* Linux のシリアル端末。作法は #screen と同じで、行数だけ違う —
     (80桁 x 9px + スクロールバー10px) : (24行 x 16px) = 730 : 384 */
  #linuxScreen {
    display: block; cursor: text; margin: 0 auto;
    width: 100%; height: auto;
    aspect-ratio: 730 / 384;
    max-width: calc((100vh - 15rem) * 730 / 384);
  }
  #linuxScreen:focus { outline: none; }
  /* **hidden 属性を効かせる。** 上の #screen が display を指定しているので、
     UAスタイルの [hidden]{display:none} が負ける。ベンチに切り替えたときに
     端末が残り続けて実際に踏んだ */
  [hidden] { display: none !important; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
    padding: .5rem .6rem; border-bottom: 1px solid #2a2a2a;
    background: #141414;
  }
  .toolbar button {
    font: inherit; font-size: .85rem; padding: .25rem .8rem; border-radius: .35rem;
    border: 1px solid #3d3d3d; background: #1e1e1e; color: #e0e0e0; cursor: pointer;
  }
  .toolbar button:hover:not(:disabled) { background: #2a2a2a; border-color: #4d4d4d; }
  .toolbar button:disabled { opacity: .35; cursor: default; }
  .toolbar .sel { font-size: .8rem; color: #9a9a9a; display: flex; gap: .3rem; align-items: center; }
  .toolbar select {
    font: inherit; font-size: .8rem; padding: .15rem .3rem; border-radius: .3rem;
    border: 1px solid #3d3d3d; background: #1e1e1e; color: #e0e0e0;
  }
  /* ネットワークボタン。**状態は色で言う** — 文字を読ませない。
     既定 (灰) は「まだ繋いでいない」で、故障ではない */
  .toolbar .netbtn { display: inline-flex; align-items: center; gap: .35rem; }
  .netbtn svg { width: 1.05em; height: 1.05em; fill: currentColor; color: #6b6b6b; }
  .netbtn svg .pin { fill: #141414; }
  .netbtn[data-net="up"] svg { color: #4ade80; }
  .netbtn[data-net="down"] svg { color: #f87171; }
  /* 接続を試している間だけ瞬く。相手が居ないときの数秒を「固まった」に見せない */
  .netbtn[data-net="wait"] svg { color: #fbbf24; animation: netblink 1s steps(2) infinite; }
  @keyframes netblink { 50% { opacity: .35 } }

  /* 設定ダイアログ。<dialog>::backdrop を使うので z-index も後始末も要らない */
  dialog.panel {
    border: 1px solid #3d3d3d; border-radius: .5rem; background: #1a1a1a; color: #e0e0e0;
    padding: 1rem 1.1rem; width: min(26rem, 92vw); font: inherit;
  }
  dialog.panel::backdrop { background: #000a; }
  dialog.panel h3 { margin: 0 0 .2rem; font-size: 1rem; font-weight: 500; }
  dialog.panel .hint { margin: 0 0 .9rem; font-size: .8rem; color: #9a9a9a; line-height: 1.5; }
  dialog.panel label { display: block; font-size: .78rem; color: #9a9a9a; margin: .6rem 0 .2rem; }
  dialog.panel input[type=text] {
    width: 100%; box-sizing: border-box; font: inherit; font-size: .85rem;
    font-family: ui-monospace, Menlo, monospace;
    padding: .3rem .45rem; border-radius: .3rem;
    border: 1px solid #3d3d3d; background: #111; color: #9fd39f;
  }
  dialog.panel .row { display: flex; gap: .5rem; align-items: center; margin-top: 1rem; }
  dialog.panel .msg { font-size: .8rem; min-height: 1.3em; margin-top: .7rem; }
  dialog.panel .msg.ok { color: #4ade80; }
  dialog.panel .msg.ng { color: #f87171; }
  dialog.panel .msg.wait { color: #fbbf24; }
  .spacer { flex: 1 }
  .gauge {
    font-family: ui-monospace, Menlo, monospace; font-size: .78rem;
    color: #5dbb5d; font-variant-numeric: tabular-nums; white-space: nowrap;
    /* ボタンが折り返して2行になっても、MIPSは常に右端に居る */
    margin-left: auto;
  }
  #status {
    padding: .45rem .7rem; font-size: .85rem; color: #9a9a9a; min-height: 2.1em;
    border-top: 1px solid #2a2a2a; background: #0d0d0d;
  }
  #status.warn { color: #fbbf24; }

  /* 左メニュー + 端末。狭い画面では上下に積む */
  .app { display: grid; grid-template-columns: 13.5rem 1fr; gap: 1rem; align-items: start; }
  @media (max-width: 52rem) { .app { grid-template-columns: 1fr; } }

  .machines h2 {
    font-size: .7rem; font-weight: 600; letter-spacing: .06em; opacity: .55;
    margin: 1rem 0 .35rem; text-transform: none;
  }
  .machines h2:first-child { margin-top: 0; }
  .machines button {
    display: block; width: 100%; text-align: left; font: inherit;
    padding: .45rem .65rem; margin-bottom: .15rem; border-radius: .45rem;
    border: none; background: transparent; color: inherit;
    cursor: pointer; line-height: 1.35;
    /* 選択中の色付き縁は box-shadow で描く — border だと行がガタつく */
    transition: background .12s;
  }
  .machines button:hover:not(:disabled) { background: rgba(128,128,128,.14); }
  .machines button[aria-current="true"] {
    background: rgba(37,99,235,.16);
    box-shadow: inset 2px 0 0 #3b82f6;
  }
  .machines button:disabled { opacity: .4; cursor: default; }
  .machines .name { font-size: .9rem; }
  /* 状態の丸。**「これから」も並べる** — どこまで行けてなぜ止まるかが見える方が教材になる */
  .dot { display: inline-block; width: .5em; height: .5em; border-radius: 50%; margin-right: .4em; }
  .dot.ok { background: #16a34a; }
  .dot.partial { background: #f59e0b; }
  .dot.todo { background: #9ca3af; }
  #machineNote { font-size: .8rem; opacity: .75; margin: .6rem 0 0; }

  .note { font-size: .85rem; opacity: .7; margin-top: 1.25rem; }
  code, kbd { font-family: ui-monospace, Menlo, monospace; font-size: .9em; }
  kbd { border: 1px solid var(--line); border-radius: .25rem; padding: 0 .3em; }
  a { color: inherit; }
</style>
</head>
<body>
  <h1>rustx86</h1>

  <div class="app">
  <nav class="machines" id="machines" aria-label="マシン"></nav>
  <div>
  <div class="console" id="console">
    <div class="toolbar">
      <button id="boot" disabled>再起動</button>
      <button id="pause" disabled>一時停止</button>
      <button id="snapExport" disabled>スナップショット書出</button>
      <button id="snapImport">スナップショット復元</button>
      <input id="snapFile" type="file" accept=".rx86snap" hidden>
      <button id="save">ログを保存</button>
      <button id="debug" disabled>デバッガ</button>
      <!-- ネットワーク。**LANポートの絵**そのもの (RJ45の爪つき) を灯りにする。
           灰=繋いでいない / 緑=繋がった / 赤=繋がらない -->
      <button id="net" class="netbtn" title="Network:Disable">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4 1.5h8v4.2h2.2v8.8H1.8V5.7H4z" />
          <rect class="pin" x="4.2" y="7.5" width="1.2" height="2.4" />
          <rect class="pin" x="6.3" y="7.5" width="1.2" height="2.4" />
          <rect class="pin" x="8.4" y="7.5" width="1.2" height="2.4" />
          <rect class="pin" x="10.5" y="7.5" width="1.2" height="2.4" />
        </svg>
        ネット
      </button>
      <label class="sel">配列
        <select id="layout">
          <option value="jp">JIS</option>
          <option value="us">US</option>
        </select>
      </label>
      <span class="spacer"></span>
      <span class="gauge" id="gauge"></span>
    </div>
    <!-- オープニング。いきなりOSが立ち上がるのではなく、まず選んでもらう -->
    <div id="welcomePane">
      <h2>rustx86 — ブラウザの中の1台のPC</h2>
      <p class="lead">Rustで書いたx86エミュレータです。実物のOSに手を加えず
        そのまま実行します。フロッピーのOSも現代のLinuxも、同じ1台で起動します。</p>
      <div class="oscards">
        <button data-open class="mediaslot">
          <span class="os">イメージを開く…</span>
          <span class="d">フロッピー/ディスクイメージ (.img) を選ぶ。
            この枠へのドロップでも起動します</span>
        </button>
      </div>
      <p class="fine">OSイメージをこのページと同じ場所に置くと、
        左のOSライブラリから起動できます (取得先は各OSを選ぶと出ます)。</p>
    </div>
    <canvas id="screen" tabindex="0" hidden></canvas>
    <!-- Linux のシリアル端末。VGAテキスト (#screen) とは描画の作法が丸ごと
         違うので canvas を分け、選ばれている方だけを見せる -->
    <canvas id="linuxScreen" tabindex="0" hidden></canvas>
    <!-- ベンチもここに出る。**OSと同じ扱い**にするため、画面と同じ場所を使う -->
    <p id="status">読み込み中…</p>
  </div>
  <p id="machineNote"></p>
  </div>
  </div>

  <!-- ネットワークの設定。**繋ぎ先を覚えるのはブラウザの仕事**なので
       localStorage に置く。URLに ?net= があるときはそちらが勝ち、
       この画面は「今どこに繋がっているか」の表示だけになる -->
  <dialog id="netDialog" class="panel">
    <h3>ネットワーク</h3>
    <p class="hint">仮想NE2000を、ユーザーモードNATの
      <a href="https://github.com/yoshiharu-ishii/wsslirp" target="_blank" rel="noopener">wsslirpd</a>
      へ繋ぎます。手元で動かしているなら既定のままで繋がります。</p>
    <form method="dialog" id="netForm">
      <label for="netUrl">接続先 (ws:// または wss://)</label>
      <input id="netUrl" type="text" value="ws://127.0.0.1:8087/net" spellcheck="false">
      <label for="netToken">トークン (デーモンに -token を付けていなければ空)</label>
      <input id="netToken" type="text" spellcheck="false" autocomplete="off">
      <p class="msg" id="netMsg"></p>
      <div class="row">
        <button id="netConnect" value="connect">繋ぐ</button>
        <button id="netDisconnect" value="disconnect" hidden>切る</button>
        <span class="spacer"></span>
        <button value="close">閉じる</button>
      </div>
    </form>
  </dialog>


  <input type="file" id="imageFile" accept=".img,.ima,.bin,.json" hidden>
  <script type="module" src="./main.js"></script>
</body>
</html>
