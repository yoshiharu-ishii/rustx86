# 結果本文つきの Check run を発行するコンポジットアクション。
#
# GitHub Actions のジョブ自体も Check として表示されるが、あれは選択しても
# ログページへのリンクにしかならない。Checks API の output にMarkdownを載せた
# Check run を別途発行すると、PRの「Checks」タブの右ペインに本文が表示される。
#
# (fuurai-dungeon で確立した型。ジョブは1本に統合し、リンクだけの項目で
#  左リストを埋めない)
name: publish-check
description: レポート本文をChecksタブの右ペインに表示する

inputs:
  name:
    description: Check runの名前(Checksタブの左リストに出る)
    required: true
  title:
    description: 右ペインの見出し
    required: true
  outcome:
    description: 対象ステップの outcome(success / failure)
    required: true
  report-file:
    description: 右ペインに表示するMarkdownファイル
    required: true

runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      env:
        CHECK_NAME: ${{ inputs.name }}
        CHECK_TITLE: ${{ inputs.title }}
        CHECK_OUTCOME: ${{ inputs.outcome }}
        REPORT_FILE: ${{ inputs.report-file }}
      with:
        script: |
          const fs = require('fs');
          const file = process.env.REPORT_FILE;
          let summary = '(レポートなし)';
          if (file && fs.existsSync(file)) {
            summary = fs.readFileSync(file, 'utf8');
            // ANSIカラーコードを除去(ツールがCI上でも色付き出力することがある)
            summary = summary.replace(/\x1B\[[0-9;]*[A-Za-z]/g, '');
            // Checks APIのsummary上限は65535文字。余裕を見て切る
            if (summary.length > 60000) summary = summary.slice(0, 60000) + '\n\n…(長すぎるため省略)';
          }
          // PRイベントではマージ用の仮コミットではなくブランチ先頭に付ける。
          // mainへのpushでは context.sha (そのコミット) に付く
          const head_sha = context.payload.pull_request?.head?.sha ?? context.sha;
          await github.rest.checks.create({
            ...context.repo,
            name: process.env.CHECK_NAME,
            head_sha,
            status: 'completed',
            conclusion: process.env.CHECK_OUTCOME === 'success' ? 'success' : 'failure',
            output: { title: process.env.CHECK_TITLE, summary },
          });
