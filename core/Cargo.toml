[package]
name = "rustx86-core"
version = "0.1.0"
edition = "2021"

[features]
# オペコード実行回数の計測 (デコードキャッシュの対象選定用)。通常ビルドは数えない
opstats = []

[dependencies]

[dev-dependencies]
rustx86-disasm = { path = "../disasm" }

# fastmem (ADR-0026) の写像はunixネイティブのみ — wasmビルドには入らない
[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
libc = "0.2"
