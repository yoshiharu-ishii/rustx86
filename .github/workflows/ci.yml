# CI パイプライン (合否掲示板、2026-08-12):
#   PR:        コードチェック → CPU照合 ∥ CPU互換 (core/cosimを触ったときだけ) → OK
#              (docsのみの変更はワークフローごとスキップ)
#   main push: コードチェック → CPU照合 ∥ CPU互換 ∥ OS起動回帰 → OK (常に全部)
#
# 設計の理由・全体図・展望は docs/reference/ci.md にまとめてある。ここは実装だけ。
#
# 要点:
# - **段構え**: 安いコードチェックが先に走り、通ったときだけ重い検査
#   (CPU照合と起動回帰) が**並行して**走る。壊れたコードに数分の検査を
#   払わない。最後の OK は全段の合流点
# - **Checksタブは2つの束** (ユーザー決定 2026-08-12):
#   「CI Actions」= 素のジョブ (この名のワークフローグループに自動で束なる)、
#   「合否掲示板」= 関門ごとの結果Check (テスト/整形/lint/wasm/CPU照合/…)。
#   掲示板は**自前GitHub Appのトークン**で発行すると独立した束になる。
#   Secrets (CI_APP_ID / CI_APP_PRIVATE_KEY) 未設定ならGITHUB_TOKENに退避
#   (Checkは出るがActionsの束に同居する)
# - レポートは**何をしたかと結果だけ**。説明の文章は docs/reference/ci.md に書く
# - 各ステージは continue-on-error で最後まで走らせてから束ねる
#   (テストが落ちてもビルドの結果は見たい)
name: CI Actions

on:
  # **paths-ignore は使わない。** docsだけの変更でワークフローごと止めると、
  # 「OK (全層)」が永久にpendingのまま残り、**必須チェックにした瞬間に
  # docsのPRがマージできなくなる** (GitHubの定番の罠)。
  #
  # 代わりに**中で絞る**: 重い検査 (CPU照合・互換) は paths-filter の
  # `cpu` が false なら skip され、OK は skipped を成功として数える。
  # docsだけのPRで実際に走るのは軽い土台のジョブ1つだけで、
  # 結果として「必ず緑の OK が出る」ことと「重い検査を払わない」が両立する
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

# 同一ブランチへの連続pushは古いRunをキャンセル (無駄な並走を消す)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never # レポートにANSIカラーコードが混ざるのを防ぐ

jobs:
  check:
    name: 1 土台 — コードチェック
    runs-on: ubuntu-latest
    env:
      HAVE_APP: ${{ secrets.CI_APP_ID != '' }}
    outputs:
      cpu: ${{ steps.filter.outputs.cpu }}
    steps:
      - uses: actions/checkout@v7
      # CPUの意味論に触れた変更か (L0 CPU照合を回すかの判定)。
      # core/cosim以外 (web/tools等) だけのPRでは重いUnicornビルドを省く
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cpu:
              - 'core/**'
              - 'cosim/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
      - uses: Swatinem/rust-cache@v2
      - run: |
          rustup target add wasm32-unknown-unknown
          rustup component add clippy rustfmt

      - name: テスト
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## テスト — `cargo test`'
            echo '```'
            cargo test > raw.log 2>&1 || RC=$?
            grep -vE '^(   Compiling|    Finished|     Running|   Doc-tests)' raw.log | tee /dev/stderr || true
            echo '```'
            exit ${RC:-0}
          } > report-test.md

      - name: 画面の判断
        id: uidecide
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## 画面の判断 — `node --test tools/webtest/*.test.mjs`'
            echo '```'
            node --test "tools/webtest/*.test.mjs" 2>&1 | tee /dev/stderr || RC=$?
            echo '```'
            exit ${RC:-0}
          } > report-uidecide.md

      - name: wasmビルド
        id: wasm
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## wasmビルド — `cargo build --target wasm32-unknown-unknown --release`'
            echo '```'
            cargo build -p rustx86-wasm --target wasm32-unknown-unknown --release 2>&1 | tee /dev/stderr || RC=$?
            echo '```'
            if [ "${RC:-0}" = "0" ]; then
              SIZE=$(wc -c < target/wasm32-unknown-unknown/release/rustx86_wasm.wasm)
              echo "rustx86_wasm.wasm (wasm-opt前): $(( SIZE / 1024 )) KB"
            fi
            exit ${RC:-0}
          } > report-wasm.md

      - name: 整形
        id: fmt
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## 整形 — `cargo fmt --check`'
            echo '```'
            cargo fmt --all --check 2>&1 | tee /dev/stderr || RC=$?
            echo '```'
            if [ "${RC:-0}" != "0" ]; then echo '`cargo fmt --all` で直る。'; fi
            exit ${RC:-0}
          } > report-fmt.md

      - name: lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## lint — `cargo clippy -- -D warnings`'
            echo '```'
            cargo clippy --workspace --exclude rustx86-cosim --all-targets -- -D warnings > raw.log 2>&1 || RC=$?
            # 指摘ゼロだとノイズ除去の grep が「一致なし= exit 1」になり、
            # pipefail が拾って**綺麗なのに落ちる**。先にファイルへ落として分離する
            grep -vE '^(    Checking|   Compiling|    Finished)' raw.log | tee /dev/stderr || true
            echo '```'
            exit ${RC:-0}
          } > report-lint.md

      # ActionsのSummaryページにも同じレポートを掲示する (Checksタブとは別画面。
      # Checks=PRレビュー時の掲示板、Actions Summary=実行を深掘りするときの一覧)
      - name: Summaryへ掲示
        if: always()
        run: |
          {
            echo '### 1 土台 — このジョブが見ている関門'
            echo ''
            echo '| 種類 | 関門 | 結果 |'
            echo '|---|---|---|'
            echo "| 単体 | テスト (Rust) | ${{ steps.test.outcome == 'success' && '✅' || '❌' }} |"
            echo "| 単体 | 画面の判断 (JS) | ${{ steps.uidecide.outcome == 'success' && '✅' || '❌' }} |"
            echo "| ビルド | wasm | ${{ steps.wasm.outcome == 'success' && '✅' || '❌' }} |"
            echo "| 静的 | 整形 | ${{ steps.fmt.outcome == 'success' && '✅' || '❌' }} |"
            echo "| 静的 | lint | ${{ steps.lint.outcome == 'success' && '✅' || '❌' }} |"
            echo ''
            echo '上の層は別ジョブが受け持つ: **2 CPU層** (照合・互換) →'
            echo '**3 機械層** (OS起動回帰・wasm起動) → **4 機能層**'
            echo '(スナップショット・貼り付け)。層の意味は docs/reference/ci.md'
            echo ''
            cat report-test.md report-uidecide.md report-wasm.md report-fmt.md report-lint.md 2>/dev/null
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- 合否掲示板への発行。1関門=1行、本文は右ペイン ----
      - name: 掲示板トークン
        id: app
        if: ${{ always() && env.HAVE_APP == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          # **client-id は「発行者 (iss)」としてそのまま JWT に載る入力**で、
          # GitHubは App ID / Client ID のどちらも受ける。だから既存の
          # CI_APP_ID (App ID) をそのまま渡せる。将来Client IDに寄せたく
          # なったらSecretの値を差し替えるだけでよい (ここは触らない)
          client-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: 1 土台 — 単体テスト (Rust)
          title: ${{ steps.test.outcome == 'success' && 'cargo test 合格' || 'cargo test 失敗' }}
          outcome: ${{ steps.test.outcome }}
          report-file: report-test.md
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: 1 土台 — 単体テスト (画面の判断・JS)
          title: ${{ steps.uidecide.outcome == 'success' && '画面の判断は合格' || '画面の判断が壊れている' }}
          outcome: ${{ steps.uidecide.outcome }}
          report-file: report-uidecide.md
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: 1 土台 — wasmビルド
          title: ${{ steps.wasm.outcome == 'success' && 'wasm32ビルド成功' || 'wasm32ビルド失敗' }}
          outcome: ${{ steps.wasm.outcome }}
          report-file: report-wasm.md
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: 1 土台 — 整形 (静的)
          title: ${{ steps.fmt.outcome == 'success' && 'cargo fmt 整形済み' || '未整形 (cargo fmt --all で直る)' }}
          outcome: ${{ steps.fmt.outcome }}
          report-file: report-fmt.md
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: 1 土台 — lint (静的)
          title: ${{ steps.lint.outcome == 'success' && 'clippy 指摘なし' || 'clippy 指摘あり' }}
          outcome: ${{ steps.lint.outcome }}
          report-file: report-lint.md
          token: ${{ steps.app.outputs.token || github.token }}

      - name: 合否判定
        run: |
          test "${{ steps.test.outcome }}" = "success" \
            && test "${{ steps.uidecide.outcome }}" = "success" \
            && test "${{ steps.wasm.outcome }}" = "success" \
            && test "${{ steps.fmt.outcome }}" = "success" \
            && test "${{ steps.lint.outcome }}" = "success"

  # ---- 段2: 重い検査。コードチェックが通ったときだけ、並行して走る ----

  cosim:
    # PRではCPUの意味論に触れたときだけ (L0)。mainへのpushでは常に回す
    name: 2 CPU層 — CPU照合
    if: github.event_name != 'pull_request' || needs.check.outputs.cpu == 'true'
    needs: check
    runs-on: ubuntu-latest
    env:
      HAVE_APP: ${{ secrets.CI_APP_ID != '' }}
    # Unicorn のビルドが刺さったときの番人。通常はキャッシュが効いて数分で終わる
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2

      - name: Unicornとの突き合わせ
        id: cosim
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## CPU照合 — `cargo test -p rustx86-cosim` (Unicornと毎命令比較)'
            echo '```'
            cargo test -p rustx86-cosim > raw.log 2>&1 || RC=$?
            grep -vE '^(   Compiling|    Finished|     Running)' raw.log | tee /dev/stderr || true
            echo '```'
            exit ${RC:-0}
          } > cosim-report.md

      - name: Summaryへ掲示
        if: always()
        run: cat cosim-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: 掲示板トークン
        id: app
        if: ${{ always() && env.HAVE_APP == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          # **client-id は「発行者 (iss)」としてそのまま JWT に載る入力**で、
          # GitHubは App ID / Client ID のどちらも受ける。だから既存の
          # CI_APP_ID (App ID) をそのまま渡せる。将来Client IDに寄せたく
          # なったらSecretの値を差し替えるだけでよい (ここは触らない)
          client-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: 2 CPU層 — CPU照合
          title: ${{ steps.cosim.outcome == 'success' && 'Unicornと一致' || '不一致あり' }}
          outcome: ${{ steps.cosim.outcome }}
          report-file: cosim-report.md
          token: ${{ steps.app.outputs.token || github.token }}

      - name: 合否判定
        run: test "${{ steps.cosim.outcome }}" = "success"

  compat386:
    # 互換ピラミッドL1 (test386.asm): POST 00〜FF完走 + EE出力44926行の
    # 期待値一致 (386SX実機で採った値)。未定義フラグまで含めた総合互換の門番。
    # 発火条件はCPU照合と同じ — CPUの意味論に触れたときだけ
    name: 2 CPU層 — CPU互換
    if: github.event_name != 'pull_request' || needs.check.outputs.cpu == 'true'
    needs: check
    runs-on: ubuntu-latest
    env:
      HAVE_APP: ${{ secrets.CI_APP_ID != '' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2

      # ROMはリポジトリに置かず毎回ビルドする (入手経路はfetch-images.sh一つ、
      # OSイメージと同じ理由)。nasmが要るのはROMを焼き直すときだけ
      - name: test386 ROMのキャッシュ
        id: rom-cache
        uses: actions/cache@v6
        with:
          path: |
            images/test386.bin
            images/test386-EE-reference.txt
          key: test386-rom-v2-${{ hashFiles('tools/images/sh/fetch-images.sh', 'tools/images/in-linux.sh', 'tools/images/Dockerfile') }}

      - name: test386 ROMのビルド (nasm)
        if: steps.rom-cache.outputs.cache-hit != 'true'
        run: |
          tools/images/sh/fetch-images.sh test386

      - name: test386 実行 (POST完走 + EE照合)
        id: t386
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## CPU互換 — test386.asm (POST FF完走 + EE出力の期待値一致)'
            echo '```'
            cargo run --release --example test386 2>&1 | tee /dev/stderr || RC=$?
            echo '```'
            exit ${RC:-0}
          } > t386-report.md

      - name: Summaryへ掲示
        if: always()
        run: cat t386-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: 掲示板トークン
        id: app
        if: ${{ always() && env.HAVE_APP == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          # **client-id は「発行者 (iss)」としてそのまま JWT に載る入力**で、
          # GitHubは App ID / Client ID のどちらも受ける。だから既存の
          # CI_APP_ID (App ID) をそのまま渡せる。将来Client IDに寄せたく
          # なったらSecretの値を差し替えるだけでよい (ここは触らない)
          client-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: 2 CPU層 — CPU互換
          title: ${{ steps.t386.outcome == 'success' && 'test386 全緑 (POST FF + EE一致)' || 'test386 不合格' }}
          outcome: ${{ steps.t386.outcome }}
          report-file: t386-report.md
          token: ${{ steps.app.outputs.token || github.token }}

      - name: 合否判定
        run: test "${{ steps.t386.outcome }}" = "success"

  wasmboot:
    name: 3 機械層 — wasm起動
    # 機械層のwasm版: 「普段ネイティブ検証・Webの時だけwasm」運用の唯一の
    # 欠点 = wasmだけで壊れる変化が日常ループで見えない (タブ税・タイマ
    # クランプの前例、今後はcfg(wasm32)の道)。ここで毎push起動まで見る。
    # コードチェックはwasmを「ビルド」するだけで「起動」はしていなかった
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.check.result == 'success' && needs.cosim.result != 'failure' && needs.compat386.result != 'failure' }}
    needs: [check, cosim, compat386]
    runs-on: ubuntu-latest
    env:
      HAVE_APP: ${{ secrets.CI_APP_ID != '' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # **同じキーなら同じ中身にする。** 3つのジョブが同じキーで別々の組を
      # 入れていたため、先に走った方の中身が全員に配られていた。ELKSの無い
      # キャッシュを掴んだジョブで貼り付け検査が落ちて気づいた (2026-08-14)
      - name: イメージのキャッシュ
        id: img-cache
        uses: actions/cache@v6
        with:
          path: images
          key: os-images-v5-${{ hashFiles('tools/images/sh/fetch-images.sh', 'tools/images/sh/extract-vmlinux.sh', 'tools/images/sh/make-mini-initramfs.sh', 'tools/images/in-linux.sh', 'tools/images/Dockerfile') }}

      - name: イメージの取得と組み立て
        if: steps.img-cache.outputs.cache-hit != 'true'
        run: |
          tools/images/sh/fetch-images.sh elks
          tools/images/sh/fetch-images.sh freedos
          tools/images/sh/fetch-images.sh linux
          tools/images/sh/extract-vmlinux.sh
          tools/images/sh/make-mini-initramfs.sh

      - name: wasm-pack の用意
        run: |
          rustup target add wasm32-unknown-unknown
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: wasm を焼いて起動 (headless — banner+snakeまで)
        id: wasmboot
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## wasm起動 — `node tools/webtest/headless.mjs`'
            echo '```'
            bash tools/build/build-web.sh 2>&1 | tail -2
            node tools/webtest/headless.mjs 2>&1 | tee /dev/stderr
            echo '```'
          } > wasmboot-report.md
          grep -q 'banner=true' wasmboot-report.md
          grep -q 'snake_board=true' wasmboot-report.md

      # mode 13h の窓 (video_mode / fb_ptr / palette) がwasm経由で描き手に
      # 渡す値そのものを返すか。asm/mode13.bin を実走して照合する
      - name: VGA mode 13h (wasm経由)
        run: node tools/webtest/vga-check.mjs

      # 貼り付けのIntegration。**配分の判断 (decide.js) と装置とゲストを
      # 一続きで見る**唯一の場所で、単体テストは配分の算数しか押さえられない。
      # wasmもイメージもこのジョブに揃っているので、ここに相乗りさせる
      - name: 貼り付けが欠けずに届くか (ELKS)
        id: pastetest
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## 貼り付け — `node tools/webtest/paste.mjs`'
            echo '```'
            node tools/webtest/paste.mjs 2>&1 | tee /dev/stderr
            echo '```'
          } > paste-report.md

      - name: Summaryへ掲示
        if: always()
        run: cat wasmboot-report.md paste-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: 掲示板トークン
        id: app
        if: ${{ always() && env.HAVE_APP == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          # **client-id は「発行者 (iss)」としてそのまま JWT に載る入力**で、
          # GitHubは App ID / Client ID のどちらも受ける。だから既存の
          # CI_APP_ID (App ID) をそのまま渡せる。将来Client IDに寄せたく
          # なったらSecretの値を差し替えるだけでよい (ここは触らない)
          client-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: 3 機械層 — wasm起動
          title: ${{ steps.wasmboot.outcome == 'success' && 'ブラウザ版もLinuxが起動する' || 'wasmで起動しない' }}
          outcome: ${{ steps.wasmboot.outcome }}
          report-file: wasmboot-report.md
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: 4 機能層 — 貼り付け
          title: ${{ steps.pastetest.outcome == 'success' && '並びどおり届き、細切れでもない' || '貼り付けが壊れている' }}
          outcome: ${{ steps.pastetest.outcome }}
          report-file: paste-report.md
          token: ${{ steps.app.outputs.token || github.token }}

      - name: 合否判定
        run: |
          test "${{ steps.wasmboot.outcome }}" = "success"
          test "${{ steps.pastetest.outcome }}" = "success"

  snapshot:
    name: 4 機能層 — スナップショット
    # 保存/復元のIntegration: 往復ビット不変 + 復元の透明性 (K命令後の全状態一致)。
    #
    # 位置は**機能層** — 互換ピラミッドの最上段 (docs/reference/ci.md):
    #   土台 (コードチェック) → CPU層 (照合+互換) → 機械層 (OS起動回帰) → ここ
    # スナップショットは「動く機械の上の機能」— OSが起動しない機械の
    # 状態保存に機能としての価値は無いので、起動回帰の合格の上に建つ。
    # 下の層がPRでskipのときは素通し (mainで証明済みのまま)、failureなら止まる
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.check.result == 'success' && needs.cosim.result != 'failure' && needs.compat386.result != 'failure' && needs.regress.result != 'failure' }}
    needs: [check, cosim, compat386, regress]
    runs-on: ubuntu-latest
    env:
      HAVE_APP: ${{ secrets.CI_APP_ID != '' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2

      # **同じキーなら同じ中身にする。** 3つのジョブが同じキーで別々の組を
      # 入れていたため、先に走った方の中身が全員に配られていた。ELKSの無い
      # キャッシュを掴んだジョブで貼り付け検査が落ちて気づいた (2026-08-14)
      - name: イメージのキャッシュ
        id: img-cache
        uses: actions/cache@v6
        with:
          path: images
          key: os-images-v5-${{ hashFiles('tools/images/sh/fetch-images.sh', 'tools/images/sh/extract-vmlinux.sh', 'tools/images/sh/make-mini-initramfs.sh', 'tools/images/in-linux.sh', 'tools/images/Dockerfile') }}

      - name: イメージの取得と組み立て
        if: steps.img-cache.outputs.cache-hit != 'true'
        run: |
          tools/images/sh/fetch-images.sh elks
          tools/images/sh/fetch-images.sh freedos
          tools/images/sh/fetch-images.sh linux
          tools/images/sh/extract-vmlinux.sh
          tools/images/sh/make-mini-initramfs.sh

      - name: 保存と復元の検査
        id: snaptest
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## スナップショット — `cargo run --release --example snaptest`'
            echo '```'
            cargo run --release --example snaptest 2>&1 | tee /dev/stderr
            echo '```'
          } > snap-report.md

      - name: Summaryへ掲示
        if: always()
        run: cat snap-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: 掲示板トークン
        id: app
        if: ${{ always() && env.HAVE_APP == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          # **client-id は「発行者 (iss)」としてそのまま JWT に載る入力**で、
          # GitHubは App ID / Client ID のどちらも受ける。だから既存の
          # CI_APP_ID (App ID) をそのまま渡せる。将来Client IDに寄せたく
          # なったらSecretの値を差し替えるだけでよい (ここは触らない)
          client-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: 4 機能層 — スナップショット
          title: ${{ steps.snaptest.outcome == 'success' && '往復ビット不変・復元は観測不能' || '保存/復元が壊れている' }}
          outcome: ${{ steps.snaptest.outcome }}
          report-file: snap-report.md
          token: ${{ steps.app.outputs.token || github.token }}

      - name: 合否判定
        run: test "${{ steps.snaptest.outcome }}" = "success"

  regress:
    name: 3 機械層 — OS起動回帰
    # PRでは回さない (ユーザー決定 2026-08-12): PRの門番はコードチェック+CPU層、
    # 機械層 (ここ+スナップショット) は**mainに載る瞬間**の門番。将来ここに
    # 4OSバイナリ互換スイート (docs/reference/ci.md の互換ピラミッド) が加わる。
    # 位置は機械層 — CPU層 (CPU照合+CPU互換) の合格の上に建つ (理由はsnapshot段の註)
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.check.result == 'success' && needs.cosim.result != 'failure' && needs.compat386.result != 'failure' }}
    needs: [check, cosim, compat386]
    runs-on: ubuntu-latest
    env:
      HAVE_APP: ${{ secrets.CI_APP_ID != '' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2

      # イメージ (GPL配布物) はリポジトリに置かず、毎回スクリプトで取得する。
      # 入手経路は tools/images/sh/fetch-images.sh ただ一つ — CIだけの取り方を作ると
      # 手元と食い違う。Actionsのキャッシュは配布ではなくCI内部の控え
      # **同じキーなら同じ中身にする。** 3つのジョブが同じキーで別々の組を
      # 入れていたため、先に走った方の中身が全員に配られていた。ELKSの無い
      # キャッシュを掴んだジョブで貼り付け検査が落ちて気づいた (2026-08-14)
      - name: イメージのキャッシュ
        id: img-cache
        uses: actions/cache@v6
        with:
          path: images
          key: os-images-v5-${{ hashFiles('tools/images/sh/fetch-images.sh', 'tools/images/sh/extract-vmlinux.sh', 'tools/images/sh/make-mini-initramfs.sh', 'tools/images/in-linux.sh', 'tools/images/Dockerfile') }}

      - name: イメージの取得と組み立て
        if: steps.img-cache.outputs.cache-hit != 'true'
        run: |
          tools/images/sh/fetch-images.sh elks
          tools/images/sh/fetch-images.sh freedos
          tools/images/sh/fetch-images.sh linux
          tools/images/sh/extract-vmlinux.sh
          tools/images/sh/make-mini-initramfs.sh

      - name: 起動回帰 (プロンプト到達 + スクショ + MIPS計測)
        id: regress
        continue-on-error: true
        # MIPS下限は「壊滅の検出」用の粗い値。共有ランナーは±10〜30%揺れるので、
        # きつくするとランナーの運で赤くなる。日々の推移はレポートの数字を見る
        env:
          REGRESS_MIN_MIPS: 10
        run: cargo run --release --example regress | tee regress.md

      # JITの決定性ゲート (F1a、ADR-0008)。生成コードとインタプリタが
      # 「シェル到達までの命令数」も「シリアル出力全文」もビット同一かを見張る。
      # 命令数決定性 (docs/perf.md の柱) をJITが崩したら即赤くする
      - name: Node の用意
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: wasm-pack の用意
        run: |
          rustup target add wasm32-unknown-unknown
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: wasm を焼く
        run: bash tools/build/build-web.sh
      # ブートログを証跡として残す。ゲストの時計は決定的なので、
      # 実行同士のログは**タイムスタンプごとdiffできる回帰資料**になる
      # (dmesgの1行増減・順序の変化・ゲスト時間での遅れが行単位で見える)
      - name: ブートログを証跡に残す
        id: logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boot-logs
          path: regress-out/
          if-no-files-found: warn

      - name: Summaryへ掲示
        if: always()
        run: |
          {
            cat regress.md 2>/dev/null || true
            echo ''
            echo "証跡: [boot-logs (シリアル全文ログ)](${{ steps.logs.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 掲示板トークン
        id: app
        if: ${{ always() && env.HAVE_APP == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          # **client-id は「発行者 (iss)」としてそのまま JWT に載る入力**で、
          # GitHubは App ID / Client ID のどちらも受ける。だから既存の
          # CI_APP_ID (App ID) をそのまま渡せる。将来Client IDに寄せたく
          # なったらSecretの値を差し替えるだけでよい (ここは触らない)
          client-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: 3 機械層 — OS起動回帰
          title: ${{ steps.regress.outcome == 'success' && 'ELKS / FreeDOS / Linux 合格' || '失敗あり' }}
          outcome: ${{ steps.regress.outcome }}
          report-file: regress.md
          token: ${{ steps.app.outputs.token || github.token }}

      - name: 合否判定
        run: |
          test "${{ steps.regress.outcome }}" = "success"

  network:
    name: 4 機能層 — ネットワーク
    # ゲストが線に出るIntegration: NICが見える → DHCP → ICMP往復 → TCPでHTTP。
    #
    # **外には出ない。** ping先は 10.0.2.2 (SLiRPのゲートウェイ = wsslirpの
    # netstackが自分で答える)、HTTPはこのジョブが立てたサーバ。相手のサイトの
    # 都合で赤くならず、ICMPの権限も要らず、誰かの本番にも当たらない。
    # ゲスト側が通る道 (NE2000/RTL8029 → WS → netstack) は実物と同じ。
    #
    # 位置は**機能層** — 動く機械の上の機能で、起動回帰の合格の上に建つ。
    # 2026-08-14、フロッピー機がPCI付きになって16bitからNICが消えた
    # デグレは、この関門があれば当日捕まっていた (docs/explanation/pitfalls 12)。
    #
    # TLS (https) はここでは見ない — 閉じた世界に信頼できる証明書は無い。
    # 実インターネット向けの手動E2E (tools/webtest/netlinux.mjs 既定) が持つ
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.check.result == 'success' && needs.cosim.result != 'failure' && needs.compat386.result != 'failure' && needs.regress.result != 'failure' }}
    needs: [check, cosim, compat386, regress]
    runs-on: ubuntu-latest
    env:
      HAVE_APP: ${{ secrets.CI_APP_ID != '' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # SLiRP backend (wsslirp) はGoで書かれた別リポジトリ。ここで建てる
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: イメージのキャッシュ
        id: img-cache
        uses: actions/cache@v6
        with:
          path: images
          key: os-images-v5-${{ hashFiles('tools/images/sh/fetch-images.sh', 'tools/images/sh/extract-vmlinux.sh', 'tools/images/sh/make-mini-initramfs.sh', 'tools/images/in-linux.sh', 'tools/images/Dockerfile') }}

      - name: イメージの取得と組み立て
        if: steps.img-cache.outputs.cache-hit != 'true'
        run: |
          tools/images/sh/fetch-images.sh elks
          tools/images/sh/fetch-images.sh freedos
          tools/images/sh/fetch-images.sh linux
          tools/images/sh/extract-vmlinux.sh
          tools/images/sh/make-mini-initramfs.sh

      - name: wasm-pack の用意
        run: |
          rustup target add wasm32-unknown-unknown
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: wasm を焼く
        run: bash tools/build/build-web.sh 2>&1 | tail -2

      - name: ゲストを線に繋ぐ (16bit + 32bit、閉じた宛先)
        id: nettest
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## ネットワーク — `bash tools/webtest/net-e2e.sh`'
            echo '```'
            bash tools/webtest/net-e2e.sh 2>&1 | tee /dev/stderr
            echo '```'
          } > net-report.md

      - name: Summaryへ掲示
        if: always()
        run: cat net-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: 掲示板トークン
        id: app
        if: ${{ always() && env.HAVE_APP == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          # **client-id は「発行者 (iss)」としてそのまま JWT に載る入力**で、
          # GitHubは App ID / Client ID のどちらも受ける。だから既存の
          # CI_APP_ID (App ID) をそのまま渡せる。将来Client IDに寄せたく
          # なったらSecretの値を差し替えるだけでよい (ここは触らない)
          client-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: 4 機能層 — ネットワーク
          title: ${{ steps.nettest.outcome == 'success' && '16bitと32bitが線に出た (DHCP→ICMP→HTTP)' || 'ゲストが線に出られない' }}
          outcome: ${{ steps.nettest.outcome }}
          report-file: net-report.md
          token: ${{ steps.app.outputs.token || github.token }}

      - name: 合否判定
        run: test "${{ steps.nettest.outcome }}" = "success"

  # ---- 合流点。全部通って初めて OK ----

  ok:
    name: OK (全層)
    if: always()
    needs: [check, cosim, compat386, regress, wasmboot, snapshot, network]
    runs-on: ubuntu-latest
    steps:
      - name: 全段の合否
        # regress はPRではskippedになる (mainへのpush時のみ必須)。
        # cosim/compat386 もCPUに触れないPRではskipped
        run: |
          test "${{ needs.check.result }}" = "success" \
            && { test "${{ needs.cosim.result }}" = "success" \
                 || test "${{ needs.cosim.result }}" = "skipped"; } \
            && { test "${{ needs.compat386.result }}" = "success" \
                 || test "${{ needs.compat386.result }}" = "skipped"; } \
            && { test "${{ needs.regress.result }}" = "success" \
                 || test "${{ needs.regress.result }}" = "skipped"; } \
            && { test "${{ needs.snapshot.result }}" = "success" \
                 || test "${{ needs.snapshot.result }}" = "skipped"; } \
            && { test "${{ needs.wasmboot.result }}" = "success" \
                 || test "${{ needs.wasmboot.result }}" = "skipped"; } \
            && { test "${{ needs.network.result }}" = "success" \
                 || test "${{ needs.network.result }}" = "skipped"; }
