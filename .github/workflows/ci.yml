# CI パイプライン (合否掲示板、2026-08-12):
#   PR:        コードチェック → CPU照合 ∥ CPU互換 (core/cosimを触ったときだけ) → OK
#              (docsのみの変更はワークフローごとスキップ)
#   main push: コードチェック → CPU照合 ∥ CPU互換 ∥ OS起動回帰 → OK (常に全部)
#
# 設計の理由・全体図・展望は docs/reference/ci.md にまとめてある。ここは実装だけ。
#
# 要点:
# - **段構え**: 安いコードチェックが先に走り、通ったときだけ重い検査
#   (CPU照合と起動回帰) が**並行して**走る。壊れたコードに数分の検査を
#   払わない。最後の OK は全段の合流点
# - **Checksタブは2つの束** (ユーザー決定 2026-08-12):
#   「CI Actions」= 素のジョブ (この名のワークフローグループに自動で束なる)、
#   「合否掲示板」= 関門ごとの結果Check (テスト/整形/lint/wasm/CPU照合/…)。
#   掲示板は**自前GitHub Appのトークン**で発行すると独立した束になる。
#   Secrets (CI_APP_ID / CI_APP_PRIVATE_KEY) 未設定ならGITHUB_TOKENに退避
#   (Checkは出るがActionsの束に同居する)
# - レポートは**何をしたかと結果だけ**。説明の文章は docs/reference/ci.md に書く
# - 各ステージは continue-on-error で最後まで走らせてから束ねる
#   (テストが落ちてもビルドの結果は見たい)
name: CI Actions

on:
  pull_request:
    # docsだけの変更に重い検査を回さない (コードに触れないため)。
    # ci.yml自身とツール類は対象のまま
    paths-ignore:
      - 'docs/**'
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

# 同一ブランチへの連続pushは古いRunをキャンセル (無駄な並走を消す)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never # レポートにANSIカラーコードが混ざるのを防ぐ

jobs:
  check:
    name: コードチェック
    runs-on: ubuntu-latest
    env:
      HAVE_APP: ${{ secrets.CI_APP_ID != '' }}
    outputs:
      cpu: ${{ steps.filter.outputs.cpu }}
    steps:
      - uses: actions/checkout@v4
      # CPUの意味論に触れた変更か (L0 CPU照合を回すかの判定)。
      # core/cosim以外 (web/tools等) だけのPRでは重いUnicornビルドを省く
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cpu:
              - 'core/**'
              - 'cosim/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
      - uses: Swatinem/rust-cache@v2
      - run: |
          rustup target add wasm32-unknown-unknown
          rustup component add clippy rustfmt

      - name: テスト
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## テスト — `cargo test`'
            echo '```'
            cargo test > raw.log 2>&1 || RC=$?
            grep -vE '^(   Compiling|    Finished|     Running|   Doc-tests)' raw.log | tee /dev/stderr || true
            echo '```'
            exit ${RC:-0}
          } > report-test.md

      - name: wasmビルド
        id: wasm
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## wasmビルド — `cargo build --target wasm32-unknown-unknown --release`'
            echo '```'
            cargo build -p rustx86-wasm --target wasm32-unknown-unknown --release 2>&1 | tee /dev/stderr || RC=$?
            echo '```'
            if [ "${RC:-0}" = "0" ]; then
              SIZE=$(wc -c < target/wasm32-unknown-unknown/release/rustx86_wasm.wasm)
              echo "rustx86_wasm.wasm (wasm-opt前): $(( SIZE / 1024 )) KB"
            fi
            exit ${RC:-0}
          } > report-wasm.md

      - name: 整形
        id: fmt
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## 整形 — `cargo fmt --check`'
            echo '```'
            cargo fmt --all --check 2>&1 | tee /dev/stderr || RC=$?
            echo '```'
            if [ "${RC:-0}" != "0" ]; then echo '`cargo fmt --all` で直る。'; fi
            exit ${RC:-0}
          } > report-fmt.md

      - name: lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## lint — `cargo clippy -- -D warnings`'
            echo '```'
            cargo clippy --workspace --exclude rustx86-cosim --all-targets -- -D warnings > raw.log 2>&1 || RC=$?
            # 指摘ゼロだとノイズ除去の grep が「一致なし= exit 1」になり、
            # pipefail が拾って**綺麗なのに落ちる**。先にファイルへ落として分離する
            grep -vE '^(    Checking|   Compiling|    Finished)' raw.log | tee /dev/stderr || true
            echo '```'
            exit ${RC:-0}
          } > report-lint.md

      # ActionsのSummaryページにも同じレポートを掲示する (Checksタブとは別画面。
      # Checks=PRレビュー時の掲示板、Actions Summary=実行を深掘りするときの一覧)
      - name: Summaryへ掲示
        if: always()
        run: |
          {
            echo '| 関門 | 結果 |'
            echo '|---|---|'
            echo "| テスト | ${{ steps.test.outcome == 'success' && '✅' || '❌' }} |"
            echo "| wasmビルド | ${{ steps.wasm.outcome == 'success' && '✅' || '❌' }} |"
            echo "| 整形 | ${{ steps.fmt.outcome == 'success' && '✅' || '❌' }} |"
            echo "| lint | ${{ steps.lint.outcome == 'success' && '✅' || '❌' }} |"
            echo ''
            cat report-test.md report-wasm.md report-fmt.md report-lint.md 2>/dev/null
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- 合否掲示板への発行。1関門=1行、本文は右ペイン ----
      - name: 掲示板トークン
        id: app
        if: ${{ always() && env.HAVE_APP == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: テスト
          title: ${{ steps.test.outcome == 'success' && 'cargo test 合格' || 'cargo test 失敗' }}
          outcome: ${{ steps.test.outcome }}
          report-file: report-test.md
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: wasmビルド
          title: ${{ steps.wasm.outcome == 'success' && 'wasm32ビルド成功' || 'wasm32ビルド失敗' }}
          outcome: ${{ steps.wasm.outcome }}
          report-file: report-wasm.md
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: 整形
          title: ${{ steps.fmt.outcome == 'success' && 'cargo fmt 整形済み' || '未整形 (cargo fmt --all で直る)' }}
          outcome: ${{ steps.fmt.outcome }}
          report-file: report-fmt.md
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: lint
          title: ${{ steps.lint.outcome == 'success' && 'clippy 指摘なし' || 'clippy 指摘あり' }}
          outcome: ${{ steps.lint.outcome }}
          report-file: report-lint.md
          token: ${{ steps.app.outputs.token || github.token }}

      - name: 合否判定
        run: |
          test "${{ steps.test.outcome }}" = "success" \
            && test "${{ steps.wasm.outcome }}" = "success" \
            && test "${{ steps.fmt.outcome }}" = "success" \
            && test "${{ steps.lint.outcome }}" = "success"

  # ---- 段2: 重い検査。コードチェックが通ったときだけ、並行して走る ----

  cosim:
    # PRではCPUの意味論に触れたときだけ (L0)。mainへのpushでは常に回す
    name: CPU照合
    if: github.event_name != 'pull_request' || needs.check.outputs.cpu == 'true'
    needs: check
    runs-on: ubuntu-latest
    env:
      HAVE_APP: ${{ secrets.CI_APP_ID != '' }}
    # Unicorn のビルドが刺さったときの番人。通常はキャッシュが効いて数分で終わる
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Unicornとの突き合わせ
        id: cosim
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## CPU照合 — `cargo test -p rustx86-cosim` (Unicornと毎命令比較)'
            echo '```'
            cargo test -p rustx86-cosim > raw.log 2>&1 || RC=$?
            grep -vE '^(   Compiling|    Finished|     Running)' raw.log | tee /dev/stderr || true
            echo '```'
            exit ${RC:-0}
          } > cosim-report.md

      - name: Summaryへ掲示
        if: always()
        run: cat cosim-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: 掲示板トークン
        id: app
        if: ${{ always() && env.HAVE_APP == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: CPU照合
          title: ${{ steps.cosim.outcome == 'success' && 'Unicornと一致' || '不一致あり' }}
          outcome: ${{ steps.cosim.outcome }}
          report-file: cosim-report.md
          token: ${{ steps.app.outputs.token || github.token }}

      - name: 合否判定
        run: test "${{ steps.cosim.outcome }}" = "success"

  compat386:
    # 互換ピラミッドL1 (test386.asm): POST 00〜FF完走 + EE出力44926行の
    # 期待値一致 (386SX実機で採った値)。未定義フラグまで含めた総合互換の門番。
    # 発火条件はCPU照合と同じ — CPUの意味論に触れたときだけ
    name: CPU互換
    if: github.event_name != 'pull_request' || needs.check.outputs.cpu == 'true'
    needs: check
    runs-on: ubuntu-latest
    env:
      HAVE_APP: ${{ secrets.CI_APP_ID != '' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # ROMはリポジトリに置かず毎回ビルドする (入手経路はfetch-images.sh一つ、
      # OSイメージと同じ理由)。nasmが要るのはROMを焼き直すときだけ
      - name: test386 ROMのキャッシュ
        id: rom-cache
        uses: actions/cache@v4
        with:
          path: |
            images/test386.bin
            images/test386-EE-reference.txt
          key: test386-rom-v1-${{ hashFiles('tools/fetch-images.sh') }}

      - name: test386 ROMのビルド (nasm)
        if: steps.rom-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm
          tools/fetch-images.sh test386

      - name: test386 実行 (POST完走 + EE照合)
        id: t386
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo '## CPU互換 — test386.asm (POST FF完走 + EE出力の期待値一致)'
            echo '```'
            cargo run --release --example test386 2>&1 | tee /dev/stderr || RC=$?
            echo '```'
            exit ${RC:-0}
          } > t386-report.md

      - name: Summaryへ掲示
        if: always()
        run: cat t386-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: 掲示板トークン
        id: app
        if: ${{ always() && env.HAVE_APP == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: CPU互換
          title: ${{ steps.t386.outcome == 'success' && 'test386 全緑 (POST FF + EE一致)' || 'test386 不合格' }}
          outcome: ${{ steps.t386.outcome }}
          report-file: t386-report.md
          token: ${{ steps.app.outputs.token || github.token }}

      - name: 合否判定
        run: test "${{ steps.t386.outcome }}" = "success"

  regress:
    name: OS起動回帰
    # PRでは回さない (ユーザー決定 2026-08-12): PRの門番はコードチェック+CPU照合、
    # OS起動回帰 (とJIT決定性) は**mainに載る瞬間**の門番。将来ここに
    # 4OSバイナリ互換スイート (docs/reference/ci.md の互換ピラミッド) が加わる
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    env:
      HAVE_APP: ${{ secrets.CI_APP_ID != '' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # イメージ (GPL配布物) はリポジトリに置かず、毎回スクリプトで取得する。
      # 入手経路は tools/fetch-images.sh ただ一つ — CIだけの取り方を作ると
      # 手元と食い違う。Actionsのキャッシュは配布ではなくCI内部の控え
      - name: イメージのキャッシュ
        id: img-cache
        uses: actions/cache@v4
        with:
          path: images
          key: os-images-v1-${{ hashFiles('tools/fetch-images.sh', 'tools/extract-vmlinux.sh', 'tools/make-mini-initramfs.sh', 'tools/mkcpio.py') }}

      - name: イメージの取得と組み立て
        if: steps.img-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpio unzip
          tools/fetch-images.sh elks
          tools/fetch-images.sh freedos-boot
          tools/fetch-images.sh linux
          tools/extract-vmlinux.sh
          tools/make-mini-initramfs.sh

      - name: 起動回帰 (プロンプト到達 + スクショ + MIPS計測)
        id: regress
        continue-on-error: true
        # MIPS下限は「壊滅の検出」用の粗い値。共有ランナーは±10〜30%揺れるので、
        # きつくするとランナーの運で赤くなる。日々の推移はレポートの数字を見る
        env:
          REGRESS_MIN_MIPS: 10
        run: cargo run --release --example regress | tee regress.md

      # JITの決定性ゲート (F1a、ADR-0008)。生成コードとインタプリタが
      # 「シェル到達までの命令数」も「シリアル出力全文」もビット同一かを見張る。
      # 命令数決定性 (docs/perf.md の柱) をJITが崩したら即赤くする
      - name: Node の用意
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: wasm-pack の用意
        run: |
          rustup target add wasm32-unknown-unknown
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: wasm を焼く
        run: bash tools/build-web.sh
      # ブートログを証跡として残す。ゲストの時計は決定的なので、
      # 実行同士のログは**タイムスタンプごとdiffできる回帰資料**になる
      # (dmesgの1行増減・順序の変化・ゲスト時間での遅れが行単位で見える)
      - name: ブートログを証跡に残す
        id: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-logs
          path: regress-out/
          if-no-files-found: warn

      - name: Summaryへ掲示
        if: always()
        run: |
          {
            cat regress.md 2>/dev/null || true
            echo ''
            echo "証跡: [boot-logs (シリアル全文ログ)](${{ steps.logs.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 掲示板トークン
        id: app
        if: ${{ always() && env.HAVE_APP == 'true' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/publish-check
        if: always()
        with:
          name: OS起動回帰
          title: ${{ steps.regress.outcome == 'success' && 'ELKS / FreeDOS / Linux 合格' || '失敗あり' }}
          outcome: ${{ steps.regress.outcome }}
          report-file: regress.md
          token: ${{ steps.app.outputs.token || github.token }}

      - name: 合否判定
        run: |
          test "${{ steps.regress.outcome }}" = "success"

  # ---- 合流点。全部通って初めて OK ----

  ok:
    name: OK
    if: always()
    needs: [check, cosim, compat386, regress]
    runs-on: ubuntu-latest
    steps:
      - name: 全段の合否
        # regress はPRではskippedになる (mainへのpush時のみ必須)。
        # cosim/compat386 もCPUに触れないPRではskipped
        run: |
          test "${{ needs.check.result }}" = "success" \
            && { test "${{ needs.cosim.result }}" = "success" \
                 || test "${{ needs.cosim.result }}" = "skipped"; } \
            && { test "${{ needs.compat386.result }}" = "success" \
                 || test "${{ needs.compat386.result }}" = "skipped"; } \
            && { test "${{ needs.regress.result }}" = "success" \
                 || test "${{ needs.regress.result }}" = "skipped"; }
